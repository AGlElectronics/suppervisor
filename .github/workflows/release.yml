name: Release GHCR images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  security:
    name: Security gate
    uses: ./.github/workflows/security.yml

  release-ref:
    name: Verify release ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a commit from main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  publish:
    name: Publish signed GHCR images
    needs:
      - ci
      - security
      - release-ref
    runs-on: ubuntu-latest
    environment: ghcr-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${repository}/web" >> "$GITHUB_OUTPUT"
      - name: Build and publish backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.images.outputs.backend }}:${{ github.ref_name }}
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
      - name: Build and publish web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: web
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.images.outputs.web }}:${{ github.ref_name }}
            ${{ steps.images.outputs.web }}:${{ github.sha }}

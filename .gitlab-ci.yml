stages: [validate, test, build, scan, release]

default:
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]

variables:
  DOCKER_TLS_CERTDIR: /certs
  GOFLAGS: -mod=readonly

go-test:
  stage: test
  image: golang:1.26-alpine
  script:
    - test -z "$(gofmt -l cmd internal)"
    - go test -race -coverprofile=coverage.out ./...
    - go vet ./...
  artifacts:
    when: always
    paths: [coverage.out]

web-test:
  stage: test
  image: node:24-alpine
  cache:
    key:
      files: [web/package-lock.json]
    paths: [web/.npm/]
  before_script:
    - cd web
    - npm ci --cache .npm --prefer-offline
  script:
    - npm test
    - npm run test:migrations
    - npm run lint
    - npm run build

migration-validation:
  stage: validate
  image: golang:1.26-alpine
  script:
    - go test ./internal/store -run TestEveryMigrationIsReversible -count=1

helm-validation:
  stage: validate
  image:
    name: alpine/helm:3.18.6
    entrypoint: [""]
  script:
    - helm lint deploy/helm/suppervisor --strict
    - helm template suppervisor deploy/helm/suppervisor --set image.backend.tag="$CI_COMMIT_SHA" --set image.web.tag="$CI_COMMIT_SHA" > rendered.yaml
  artifacts:
    paths: [rendered.yaml]

dependency-scan:
  stage: scan
  image: golang:1.26-alpine
  before_script:
    - apk add --no-cache nodejs npm
    - go install golang.org/x/vuln/cmd/govulncheck@latest
  script:
    - govulncheck ./...
    - cd web
    - npm ci --ignore-scripts
    - npm audit --audit-level=high

filesystem-scan:
  stage: scan
  image:
    name: aquasec/trivy:0.75.0
    entrypoint: [""]
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed .

image-scan:
  stage: build
  image: docker:28.4.0
  services:
    - name: docker:28.4.0-dind
      alias: docker
  before_script:
    - apk add --no-cache curl
    - wget -qO- https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz | tar -xz -C /usr/local/bin trivy
  script:
    - docker build -t suppervisor-api:"$CI_COMMIT_SHA" .
    - docker build -t suppervisor-web:"$CI_COMMIT_SHA" web
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed suppervisor-api:"$CI_COMMIT_SHA"
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed suppervisor-web:"$CI_COMMIT_SHA"

release-images:
  stage: release
  image: docker:28.4.0
  services:
    - name: docker:28.4.0-dind
      alias: docker
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" .
    - docker build -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_TAG" web
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker tag "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_TAG" "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"

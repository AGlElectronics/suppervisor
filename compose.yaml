name: suppervisor

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    APP_ENV: development
    AUTH_DEV_BYPASS: "true"
    DEV_DEMO_DATA: ${DEV_DEMO_DATA:-true}
    DATABASE_URL: postgres://suppervisor:${POSTGRES_PASSWORD:-suppervisor}@postgres:5432/suppervisor?sslmode=disable
    OLLAMA_URL: ${OLLAMA_URL:-}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
    TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
    TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
    TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    WEB_ORIGIN: http://localhost:${WEB_PORT:-4179}
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: suppervisor
      POSTGRES_USER: suppervisor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suppervisor}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suppervisor -d suppervisor"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-55432}:5432"

  migrations:
    <<: *backend
    command: ["migrate"]
    restart: "no"

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8091}:8091"
    healthcheck:
      test: ["CMD", "/suppervisor", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  web:
    build:
      context: web
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
      - /var/run:size=1m,mode=0755,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    ports:
      - "${WEB_PORT:-4179}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 6

  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  ollama-data:

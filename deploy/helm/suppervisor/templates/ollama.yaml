{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "suppervisor.fullname" . }}-ollama
  labels: {{- include "suppervisor.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "suppervisor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
  ports:
    - { name: http, port: 11434, targetPort: http }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "suppervisor.fullname" . }}-ollama
  labels: {{- include "suppervisor.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "suppervisor.fullname" . }}-ollama
  replicas: 1
  selector:
    matchLabels:
      {{- include "suppervisor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        {{- include "suppervisor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ollama
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          securityContext: {{- include "suppervisor.securityContext" . | nindent 12 }}
          env:
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            - { name: OLLAMA_MODELS, value: /models }
          ports:
            - { name: http, containerPort: 11434 }
          readinessProbe:
            httpGet: { path: /api/tags, port: http }
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/tags, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              {{- toYaml .Values.ollama.resources.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.ollama.resources.limits | nindent 14 }}
              {{- if .Values.ollama.gpu.enabled }}
              {{ .Values.ollama.gpu.resourceName }}: {{ .Values.ollama.gpu.count }}
              {{- end }}
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
      {{- if not .Values.ollama.persistence.enabled }}
        - name: models
          emptyDir: {}
      {{- end }}
  {{- if .Values.ollama.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.ollama.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.ollama.persistence.size }}
  {{- end }}
{{- end }}
